name: Build LAGZERO_Tweaker EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psutil pyinstaller
    
    - name: Build EXE with PyInstaller
      run: |
        cd LAGZERO_Tweaker
        pyinstaller --onefile --windowed --name LAGZERO_Tweaker lagzero_tweaker.py
    
    - name: Upload EXE as artifact
      uses: actions/upload-artifact@v3
      with:
        name: LAGZERO_Tweaker
        path: LAGZERO_Tweaker/dist/LAGZERO_Tweaker.exe
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
    
    - name: Upload Release Asset
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: LAGZERO_Tweaker/dist/LAGZERO_Tweaker.exe
        asset_name: LAGZERO_Tweaker.exe
        asset_content_type: application/octet-stream
